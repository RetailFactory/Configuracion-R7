apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: r7-dev

resources:
  - ../../base
  - sap-service-layer-ca.configmap.yaml

images:
  - name: docker.io/retailfactory/backend-r7
    newTag: 5285994d

patches:
  # kustomize ignora `$patch: replace` en items de env (el valueFrom del base
  # sobrevive), por eso estos dos overrides van como JSON6902 por indice con
  # op:test de guarda, igual que el overlay sap-dev. Si el env del base cambia
  # de orden, el build falla en el op:test en lugar de desplegar mal.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/63/name
        value: SAP_HTTP_ALLOW_SELF_SIGNED
      - op: remove
        path: /spec/template/spec/containers/0/env/63/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/63/value
        value: "false"
      - op: test
        path: /spec/template/spec/containers/0/env/65/name
        value: SAP_WORKER_ENABLED
      - op: remove
        path: /spec/template/spec/containers/0/env/65/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/65/value
        value: "true"
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 1
        template:
          spec:
            hostAliases:
              - ip: "200.12.40.202"
                hostnames:
                  - ip-192-168-101-6
            containers:
              - name: backend
                env:
                  - name: SSO_MOCK_MODE
                    value: "true"
                  - name: NODE_EXTRA_CA_CERTS
                    value: /etc/r7/certs/sap-service-layer-ca.crt
                  # PULSE pilot (company 224). Keys live in secret r7-pulse-keys, created out of Git.
                  # Trusts only the k3s pod CIDR (Kong); the app still ignores x-forwarded-proto from other peers.
                  - name: R7_TRUSTED_PROXIES
                    value: 10.42.0.0/16
                  - name: R7_PULSE_CATALOG_ENABLED
                    value: "true"
                  - name: R7_PULSE_CATALOG_COMPANY
                    value: "224"
                  - name: R7_PULSE_CATALOG_STORE_IDS
                    value: 4b7de13b-7d8f-4ab7-b42a-4e1f333714d7
                  - name: R7_PULSE_CATALOG_KEY
                    valueFrom:
                      secretKeyRef:
                        name: r7-pulse-keys
                        key: CATALOG_KEY
                  - name: R7_PULSE_INC_ENABLED
                    value: "true"
                  - name: R7_PULSE_SELF_SERVICE_ENABLED
                    value: "true"
                  - name: R7_PULSE_INC_COMPANY
                    value: "224"
                  - name: R7_PULSE_INC_STORE_IDS
                    value: 4b7de13b-7d8f-4ab7-b42a-4e1f333714d7
                  - name: R7_PULSE_INC_KEY
                    valueFrom:
                      secretKeyRef:
                        name: r7-pulse-keys
                        key: INC_KEY
                  # Subdirectory of the csv-imports PVC: the module creates it 0700 (the mount root is group-writable).
                  - name: R7_PULSE_INC_DIR
                    value: /var/lib/r7/csv-imports/pulse-inc
                  - name: R7_PULSE_INC_MAX_PART_BYTES
                    value: "67108864"
                  - name: R7_PULSE_INC_MAX_TOTAL_BYTES
                    value: "2147483648"
                  - name: R7_PULSE_INC_MAX_RUN_MS
                    value: "1800000"
                  - name: R7_PULSE_INC_MAX_CHANGES
                    value: "10000"
                  - name: R7_PULSE_INC_MIN_FREE_BYTES
                    value: "1073741824"
                volumeMounts:
                  - name: sap-service-layer-ca
                    mountPath: /etc/r7/certs/sap-service-layer-ca.crt
                    subPath: sap-service-layer-ca.crt
                    readOnly: true
            volumes:
              - name: sap-service-layer-ca
                configMap:
                  name: sap-service-layer-ca
                  items:
                    - key: sap-service-layer-ca.crt
                      path: sap-service-layer-ca.crt
  # El worker CSV importa indirectamente SapSyncModule y hereda backend-secrets
  # mediante envFrom. Mantener estas variables explícitas evita que se convierta
  # en un segundo consumidor de la cola SAP sin desactivar las importaciones CSV.
  - target:
      kind: Deployment
      name: backend-csv-import-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-csv-import-worker
      spec:
        template:
          spec:
            containers:
              - name: csv-import-worker
                env:
                  - name: SAP_HTTP_ALLOW_SELF_SIGNED
                    value: "false"
                  - name: SAP_WORKER_ENABLED
                    value: "false"
  - target:
      kind: Service
      name: backend
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        annotations:
          konghq.com/read-timeout: "240000"
          konghq.com/write-timeout: "240000"
          konghq.com/retries: "0"
