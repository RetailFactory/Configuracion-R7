apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: r7-sap-dev

resources:
  - ../../base
  - sap-service-layer-ca.configmap.yaml

images:
  - name: docker.io/retailfactory/backend-r7
    newTag: 8d1f9d0e

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SSO_MOCK_MODE
          value: "true"
      - op: test
        path: /spec/template/spec/containers/0/env/39/name
        value: SAP_HTTP_ALLOW_SELF_SIGNED
      - op: remove
        path: /spec/template/spec/containers/0/env/39/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/39/value
        value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /etc/r7/certs/sap-service-layer-ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: sap-service-layer-ca
            mountPath: /etc/r7/certs/sap-service-layer-ca.crt
            subPath: sap-service-layer-ca.crt
            readOnly: true
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: "200.12.40.202"
            hostnames:
              - ip-192-168-101-6
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: sap-service-layer-ca
            configMap:
              name: sap-service-layer-ca
              items:
                - key: sap-service-layer-ca.crt
                  path: sap-service-layer-ca.crt
      - op: test
        path: /spec/template/spec/containers/0/env/41/name
        value: SAP_WORKER_ENABLED
      - op: remove
        path: /spec/template/spec/containers/0/env/41/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/41/value
        value: "true"
  - target:
      kind: Service
      name: backend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 32049
