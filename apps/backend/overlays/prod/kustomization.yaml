apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: r7-prod

resources:
  - ../../base
  - pulse-integration.configmap.yaml

images:
  - name: docker.io/retailfactory/backend-r7
    newTag: "5537b773"

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: pulse-integration-config
          - secretRef:
              name: pulse-integration-secrets
