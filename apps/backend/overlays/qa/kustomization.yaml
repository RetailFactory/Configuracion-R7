apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: r7-qa

resources:
  - ../../base
  - sap-service-layer-ca.configmap.yaml

images:
  - name: docker.io/retailfactory/backend-r7
    newTag: 1a1667a2

patches:
  # Los índices se validan antes de reemplazar valueFrom para evitar que un
  # cambio en el deployment base active una variable equivocada.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/60/name
        value: SAP_HTTP_ALLOW_SELF_SIGNED
      - op: remove
        path: /spec/template/spec/containers/0/env/60/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/60/value
        value: "false"
      - op: test
        path: /spec/template/spec/containers/0/env/62/name
        value: SAP_WORKER_ENABLED
      - op: remove
        path: /spec/template/spec/containers/0/env/62/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/62/value
        value: "true"
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 1
        template:
          spec:
            hostAliases:
              - ip: "200.12.40.202"
                hostnames:
                  - ip-192-168-101-6
            containers:
              - name: backend
                env:
                  - name: SSO_MOCK_MODE
                    value: "true"
                  - name: NODE_EXTRA_CA_CERTS
                    value: /etc/r7/certs/sap-service-layer-ca.crt
                volumeMounts:
                  - name: sap-service-layer-ca
                    mountPath: /etc/r7/certs/sap-service-layer-ca.crt
                    subPath: sap-service-layer-ca.crt
                    readOnly: true
            volumes:
              - name: sap-service-layer-ca
                configMap:
                  name: sap-service-layer-ca
                  items:
                    - key: sap-service-layer-ca.crt
                      path: sap-service-layer-ca.crt
  - target:
      kind: Deployment
      name: backend-csv-import-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # El worker CSV importa indirectamente SapSyncModule. Como usa envFrom sobre
  # backend-secrets, estas dos variables deben quedar bloqueadas explícitamente
  # para que nunca se convierta en un segundo consumidor de la cola SAP.
  - target:
      kind: Deployment
      name: backend-csv-import-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-csv-import-worker
      spec:
        template:
          spec:
            containers:
              - name: csv-import-worker
                env:
                  - name: SAP_HTTP_ALLOW_SELF_SIGNED
                    value: "false"
                  - name: SAP_WORKER_ENABLED
                    value: "false"
  - target:
      kind: Service
      name: backend
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        annotations:
          konghq.com/read-timeout: "240000"
          konghq.com/write-timeout: "240000"
          konghq.com/retries: "0"
