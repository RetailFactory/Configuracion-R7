apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      # Post-deploy gate for the non-transactional customer-search operation.
      # The application pod cannot become available until missing/invalid
      # concurrent indexes have been repaired and verified.
      initContainers:
        - name: reconcile-customer-search-indexes
          image: docker.io/retailfactory/backend-r7:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/scripts/reconcile-customer-search-indexes.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: docker.io/retailfactory/backend-r7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: SYNC_BOOTSTRAP_PAGE_MAX_ROWS
              value: "250"
            - name: SYNC_BOOTSTRAP_PAGE_MAX_BYTES
              value: "65536"
            - name: SYNC_BOOTSTRAP_ROW_MAX_BYTES
              value: "1048576"
            - name: SYNC_BOOTSTRAP_MAX_SESSIONS
              value: "12"
            - name: SYNC_BOOTSTRAP_MAX_SESSIONS_PER_DEVICE
              value: "1"
            - name: SYNC_BOOTSTRAP_SESSION_TTL_SECONDS
              value: "7200"
            - name: SYNC_BOOTSTRAP_MAX_SNAPSHOT_BYTES
              value: "1073741824"
            - name: SYNC_BOOTSTRAP_PAGE_TIMEOUT_MS
              value: "30000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL

            - name: POWERBI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POWERBI_API_KEY

            - name: POWERBI_COD_EMP
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POWERBI_COD_EMP
                  optional: true

            - name: POWERBI_ALLOWED_COMPANIES
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POWERBI_ALLOWED_COMPANIES
                  optional: true

            - name: CSV_IMPORT_STORAGE_PATH
              value: "/var/lib/r7/csv-imports"

            - name: CSV_IMPORT_MAX_FILE_SIZE_BYTES
              value: "1073741824"

            - name: CSV_IMPORT_DEFAULT_CHUNK_SIZE_BYTES
              value: "8388608"

            - name: CSV_IMPORT_ASYNC_THRESHOLD_BYTES
              value: "10485760"

            - name: CSV_IMPORT_CHUNK_TIMEOUT_MS
              value: "300000"

            - name: CSV_IMPORT_ROW_HEARTBEAT_EVERY_ROWS
              value: "100"

            - name: CSV_IMPORT_STALLED_AFTER_SECONDS
              value: "180"

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RABBITMQ_URL

            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PRIVATE_KEY
            
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PUBLIC_KEY

            - name: GIFT_CARD_AUTHORIZATION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GIFT_CARD_AUTHORIZATION_PRIVATE_KEY

            - name: GIFT_CARD_AUTHORIZATION_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GIFT_CARD_AUTHORIZATION_PUBLIC_KEYS

            - name: GIFT_CARD_AUTHORIZATION_ACTIVE_KID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GIFT_CARD_AUTHORIZATION_ACTIVE_KID
                  optional: true

            - name: GIFT_CARD_AUTHORIZED_TTL_SECONDS
              value: "600"

            - name: GIFT_CARD_COMMITTING_TTL_SECONDS
              value: "86400"

            - name: SSO_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_PROVIDER_NAME
                  optional: true

            - name: SSO_DEFAULT_COD_EMP
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_DEFAULT_COD_EMP
                  optional: true

            - name: SSO_IDP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_PUBLIC_KEY
                  optional: true

            - name: SSO_IDP_ISSUER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_ISSUER
                  optional: true

            - name: SSO_IDP_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_AUDIENCE
                  optional: true

            - name: SSO_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_TOKEN_ENDPOINT
                  optional: true

            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_ID
                  optional: true

            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true

            - name: SSO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_REDIRECT_URI
                  optional: true

            - name: SSO_ALLOW_INSECURE_TOKEN_PARSE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_ALLOW_INSECURE_TOKEN_PARSE
                  optional: true

            - name: FEL_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_PROVIDER
                  optional: true

            - name: FEL_ENV
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_ENV
                  optional: true

            - name: FEL_EXTERNAL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_EXTERNAL_ENABLED
                  optional: true

            - name: FEL_EXTERNAL_AUTO_CERTIFY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_EXTERNAL_AUTO_CERTIFY
                  optional: true

            - name: FEL_ENABLE_FULL_CYCLE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_ENABLE_FULL_CYCLE_ENDPOINT
                  optional: true

            - name: FEL_BLOCK_CHECKOUT_ON_XML_ERROR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_BLOCK_CHECKOUT_ON_XML_ERROR
                  optional: true

            - name: FEL_INFILE_DRCWEB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCWEB_URL
                  optional: true

            - name: FEL_INFILE_DRCWEB_ARCHIVO_MODE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCWEB_ARCHIVO_MODE
                  optional: true

            - name: FEL_INFILE_DRCCER_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCCER_URL
                  optional: true

            - name: FEL_INFILE_DRCCER_ANULACION_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCCER_ANULACION_URL
                  optional: true

            - name: FEL_INFILE_NIT_EMISOR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_NIT_EMISOR
                  optional: true

            - name: FEL_INFILE_NOMBRE_EMISOR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_NOMBRE_EMISOR
                  optional: true

            - name: FEL_INFILE_ALIAS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_ALIAS
                  optional: true

            - name: FEL_INFILE_LLAVE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_LLAVE
                  optional: true

            - name: FEL_INFILE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_TOKEN
                  optional: true

            - name: FEL_INFILE_CODIGO
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CODIGO
                  optional: true

            - name: FEL_INFILE_CORREO_COPIA
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CORREO_COPIA
                  optional: true

            - name: FEL_INFILE_FRASES
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_FRASES
                  optional: true

            - name: FEL_INFILE_CERT_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CERT_AUTH_HEADER
                  optional: true

            - name: FEL_INFILE_CERT_AUTH_PREFIX
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CERT_AUTH_PREFIX
                  optional: true

            - name: SAP01_SAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP01_SAP_USERNAME
                  optional: true

            - name: SAP01_SAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP01_SAP_PASSWORD
                  optional: true

            - name: SAP_HTTP_ALLOW_SELF_SIGNED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_HTTP_ALLOW_SELF_SIGNED
                  optional: true

            - name: SAP_SESSION_CACHE_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_SESSION_CACHE_TTL_SECONDS
                  optional: true

            - name: SAP_WORKER_ENABLED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_ENABLED
                  optional: true

            - name: SAP_WORKER_BATCH_SIZE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_BATCH_SIZE
                  optional: true

            - name: SAP_WORKER_POLL_INTERVAL_MS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_POLL_INTERVAL_MS
                  optional: true

            - name: FEL_CONTINGENCY_ENABLED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_CONTINGENCY_ENABLED
                  optional: true

          startupProbe:
            httpGet:
              path: /api/v1/sync/connectivity
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/sync/connectivity
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/sync/connectivity
              port: 3000
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: csv-imports
              mountPath: /var/lib/r7/csv-imports
      volumes:
        - name: csv-imports
          persistentVolumeClaim:
            claimName: csv-imports
