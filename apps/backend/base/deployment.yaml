apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backend
          image: docker.io/retailfactory/backend-r7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RABBITMQ_URL

            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PRIVATE_KEY
            
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PUBLIC_KEY

            - name: SSO_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_PROVIDER_NAME
                  optional: true

            - name: SSO_DEFAULT_COD_EMP
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_DEFAULT_COD_EMP
                  optional: true

            - name: SSO_IDP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_PUBLIC_KEY
                  optional: true

            - name: SSO_IDP_ISSUER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_ISSUER
                  optional: true

            - name: SSO_IDP_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_AUDIENCE
                  optional: true

            - name: SSO_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_TOKEN_ENDPOINT
                  optional: true

            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_ID
                  optional: true

            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true

            - name: SSO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_REDIRECT_URI
                  optional: true

            - name: SSO_ALLOW_INSECURE_TOKEN_PARSE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_ALLOW_INSECURE_TOKEN_PARSE
                  optional: true

            - name: FEL_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_PROVIDER
                  optional: true

            - name: FEL_ENV
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_ENV
                  optional: true

            - name: FEL_EXTERNAL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_EXTERNAL_ENABLED
                  optional: true

            - name: FEL_EXTERNAL_AUTO_CERTIFY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_EXTERNAL_AUTO_CERTIFY
                  optional: true

            - name: FEL_ENABLE_FULL_CYCLE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_ENABLE_FULL_CYCLE_ENDPOINT
                  optional: true

            - name: FEL_BLOCK_CHECKOUT_ON_XML_ERROR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_BLOCK_CHECKOUT_ON_XML_ERROR
                  optional: true

            - name: FEL_INFILE_DRCWEB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCWEB_URL
                  optional: true

            - name: FEL_INFILE_DRCWEB_ARCHIVO_MODE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCWEB_ARCHIVO_MODE
                  optional: true

            - name: FEL_INFILE_DRCCER_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCCER_URL
                  optional: true

            - name: FEL_INFILE_DRCCER_ANULACION_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_DRCCER_ANULACION_URL
                  optional: true

            - name: FEL_INFILE_NIT_EMISOR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_NIT_EMISOR
                  optional: true

            - name: FEL_INFILE_NOMBRE_EMISOR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_NOMBRE_EMISOR
                  optional: true

            - name: FEL_INFILE_ALIAS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_ALIAS
                  optional: true

            - name: FEL_INFILE_LLAVE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_LLAVE
                  optional: true

            - name: FEL_INFILE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_TOKEN
                  optional: true

            - name: FEL_INFILE_CODIGO
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CODIGO
                  optional: true

            - name: FEL_INFILE_CORREO_COPIA
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CORREO_COPIA
                  optional: true

            - name: FEL_INFILE_FRASES
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_FRASES
                  optional: true

            - name: FEL_INFILE_CERT_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CERT_AUTH_HEADER
                  optional: true

            - name: FEL_INFILE_CERT_AUTH_PREFIX
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FEL_INFILE_CERT_AUTH_PREFIX
                  optional: true

            - name: SAP01_SAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP01_SAP_USERNAME
                  optional: true

            - name: SAP01_SAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP01_SAP_PASSWORD
                  optional: true

            - name: SAP_HTTP_ALLOW_SELF_SIGNED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_HTTP_ALLOW_SELF_SIGNED
                  optional: true

            - name: SAP_SESSION_CACHE_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_SESSION_CACHE_TTL_SECONDS
                  optional: true

            - name: SAP_WORKER_ENABLED
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_ENABLED
                  optional: true

            - name: SAP_WORKER_BATCH_SIZE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_BATCH_SIZE
                  optional: true

            - name: SAP_WORKER_POLL_INTERVAL_MS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SAP_WORKER_POLL_INTERVAL_MS
                  optional: true

          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
