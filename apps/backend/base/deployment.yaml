apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backend
          image: docker.io/retailfactory/backend-r7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RABBITMQ_URL

            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PRIVATE_KEY
            
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_PUBLIC_KEY

            - name: SSO_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_PROVIDER_NAME
                  optional: true

            - name: SSO_DEFAULT_COD_EMP
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_DEFAULT_COD_EMP
                  optional: true

            - name: SSO_IDP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_PUBLIC_KEY
                  optional: true

            - name: SSO_IDP_ISSUER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_ISSUER
                  optional: true

            - name: SSO_IDP_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_IDP_AUDIENCE
                  optional: true

            - name: SSO_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_TOKEN_ENDPOINT
                  optional: true

            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_ID
                  optional: true

            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true

            - name: SSO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_REDIRECT_URI
                  optional: true

            - name: SSO_ALLOW_INSECURE_TOKEN_PARSE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SSO_ALLOW_INSECURE_TOKEN_PARSE
                  optional: true

          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
