apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: r7-sap-dev

resources:
  - ../../base

images:
  - name: docker.io/retailfactory/frontend-r7
    newTag: fc725cc4

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 32048
