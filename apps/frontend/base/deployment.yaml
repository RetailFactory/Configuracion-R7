apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/retailfactory/frontend-r7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_CSV_IMPORT_MAX_FILE_SIZE_BYTES
              value: "1073741824"
            - name: NEXT_PUBLIC_CSV_IMPORT_CHUNK_SIZE_BYTES
              value: "8388608"
            - name: NEXT_PUBLIC_CSV_IMPORT_ASYNC_THRESHOLD_BYTES
              value: "10485760"
            - name: BFF_CSV_IMPORT_CHUNK_TIMEOUT_MS
              value: "300000"
          envFrom:
            # BFF runtime-only configuration. Do not expose these values as NEXT_PUBLIC_*.
            - secretRef:
                name: frontend-secrets

          # Probes simples para etapa de evaluación CI/CD
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
