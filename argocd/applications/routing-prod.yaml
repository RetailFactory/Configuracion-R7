apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routing-prod
  namespace: argocd
spec:
  project: r7-project
  source:
    repoURL: https://github.com/RetailFactory/Configuracion-R7.git
    targetRevision: deploy/prod
    path: apps/routing/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: r7-prod
  syncPolicy:
    # Manual a proposito, igual que backend-prod y frontend-prod: PROD nunca
    # se sincroniza solo.
    syncOptions:
      - CreateNamespace=true
