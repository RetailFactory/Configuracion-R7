apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd
spec:
  project: r7-project
  source:
    repoURL: git@github.com:RetailFactory/Configuracion-R7.git
    targetRevision: ef6933bf5b24827d45b5433e9ac2efd1d723dd8a
    path: apps/backend/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: r7-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
